<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="t-title">البحث</title>
  <meta name="description" content="Ofouq Academie - search peer-reviewed research, articles, files and publications. ISSN 3119-6691">
  <meta name="theme-color" content="#009bc4">
  <link rel="icon" type="image/jpeg" href="logo1222.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --primary:#009bc4;
      --primary-dark:#00667f;
      --primary-soft:#e5f6f9;
      --nav-bg:#e7f5f8;
      --text-main:#23424b;
      --gold:#d4af37;
    }
    html,body{width:100%;overflow-x:hidden;}
    body{font-family:"Tajawal",sans-serif;background:#f8fbfc;color:#222;line-height:1.7;}

    header{
      position:sticky;top:0;z-index:999;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:10px 20px;background:var(--nav-bg);
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }
    .logo img{width:64px;height:auto;display:block;}
    header nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    header nav a{color:var(--text-main);text-decoration:none;font-weight:700;font-size:13px;}
    header nav a:hover{color:var(--primary);}
    .lang-switch{display:flex;gap:6px;}
    .lang-switch button{
      border:1px solid #cbd5e1;background:#fff;border-radius:999px;
      padding:4px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--primary-dark);cursor:pointer;
    }
    .lang-switch button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;}

    .hero{
      padding:clamp(36px,8vw,60px) clamp(16px,6vw,40px) 28px;
      background:linear-gradient(135deg,#f6fbff,var(--primary-soft));
      text-align:center;
    }
    .hero h1{font-size:clamp(22px,4.6vw,32px);color:#064b63;margin-bottom:14px;}
    .search-form{display:flex;gap:8px;max-width:620px;margin:0 auto;}
    .search-form input{
      flex:1;min-width:0;padding:13px 18px;border-radius:999px;border:1px solid #cbd5e1;
      font:inherit;font-size:15px;outline:none;background:#fff;
    }
    .search-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,155,196,.15);}
    .search-form button{
      border:none;border-radius:999px;padding:0 22px;font:inherit;font-weight:800;color:#fff;cursor:pointer;
      background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    }
    .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
    .filters button{
      border:1px solid #d7edf4;background:#fff;color:#0d6b8c;border-radius:999px;
      padding:6px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    }
    .filters button[aria-pressed="true"]{background:#0d6b8c;color:#fff;border-color:#0d6b8c;}

    main{max-width:960px;margin:0 auto;padding:24px clamp(16px,5vw,32px) 48px;}
    .summary{color:#4b5c63;font-size:14px;margin-bottom:16px;min-height:22px;}
    .results{display:flex;flex-direction:column;gap:12px;}
    .result{
      display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;
      background:#fff;border:1px solid #e7edf1;border-radius:16px;padding:14px 16px;
      box-shadow:0 2px 12px rgba(15,23,42,.04);transition:transform .2s ease, box-shadow .2s ease;
    }
    .result:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(13,107,140,.12);}
    .result img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex-shrink:0;background:#eef6fb;}
    .result-body{min-width:0;}
    .result-type{
      display:inline-block;font-size:11px;font-weight:800;color:#7a5d00;background:#fff8df;
      border:1px solid rgba(212,175,55,.35);border-radius:999px;padding:1px 10px;margin-bottom:4px;
    }
    .result h2{font-size:16px;color:#0d6b8c;line-height:1.5;margin-bottom:2px;}
    .result .meta{font-size:12px;color:#6b7280;margin-bottom:4px;}
    .result p{font-size:13px;color:#555;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    mark{background:#fff3b0;color:inherit;border-radius:3px;padding:0 1px;}
    .empty{text-align:center;color:#6b7280;padding:40px 16px;}

    footer{
      background:linear-gradient(135deg,#0d6b8c 0%,#00667f 100%);color:#e6f3ff;
      text-align:center;padding:24px 16px;font-size:13px;
    }
    footer a{color:#ffd86b;text-decoration:none;font-weight:800;}

    @media(max-width:640px){
      header{flex-wrap:wrap;}
      header nav{order:3;width:100%;justify-content:center;}
      .result img{width:64px;height:64px;}
    }
  </style>
  <link rel="stylesheet" href="site.css">
</head>
<body>

<header>
  <a class="logo" href="index.html"><img src="logo1.png" alt="Ofouq Academie"></a>
  <nav aria-label="Main">
    <a href="index.html" data-t="nav_home">الرئيسية</a>
    <a href="research.html" data-t="nav_research_peer">أبحاث محكمة</a>
    <a href="articles.html" data-t="nav_articles_peer">مقالات محكمة</a>
    <a href="editions.html" data-t="nav_editions">إصداراتنا</a>
    <a href="contact.html" data-t="nav_contact">اتصل بنا</a>
  </nav>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="ar" onclick="setLang('ar')">AR</button>
    <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" data-lang="fr" onclick="setLang('fr')">FR</button>
  </div>
</header>

<section class="hero">
  <h1 data-t="heading">ابحث في المنصة</h1>
  <form class="search-form" role="search" onsubmit="submitSearch(event)">
    <input type="search" id="q" data-ph="placeholder" placeholder="عنوان، كاتب، موضوع..." autocomplete="off" aria-label="Search">
    <button type="submit" data-t="go">بحث</button>
  </form>
  <div class="filters" id="filters" role="group"></div>
</section>

<main id="main">
  <div class="summary" id="summary" role="status" aria-live="polite"></div>
  <div class="results" id="results"></div>
</main>

<footer>
  <a href="https://ofouqacademie.com">Ofouq Academie</a> · © 2026 · ISSN 3119-6691
</footer>

<script type="module" src="/firestore-bridge.js"></script>
<script>
const translations = {
  ar: {
    title: 'البحث', heading: 'ابحث في المنصة', placeholder: 'عنوان، كاتب، موضوع...', go: 'بحث',
    all: 'الكل', results: 'نتيجة لـ', none: 'لا توجد نتائج مطابقة. جرّب كلمات أخرى.',
    prompt: 'اكتب كلمة للبحث في الأبحاث والمقالات والملفات والإصدارات.', loading: 'جاري تحميل المحتوى...',
    by: 'بقلم:'
  },
  en: {
    title: 'Search', heading: 'Search the platform', placeholder: 'Title, author, topic...', go: 'Search',
    all: 'All', results: 'results for', none: 'No matching results. Try different words.',
    prompt: 'Type a word to search research, articles, files and publications.', loading: 'Loading content...',
    by: 'By'
  },
  fr: {
    title: 'Recherche', heading: 'Rechercher sur la plateforme', placeholder: 'Titre, auteur, sujet...', go: 'Rechercher',
    all: 'Tout', results: 'résultats pour', none: 'Aucun résultat. Essayez d\'autres mots.',
    prompt: 'Saisissez un mot pour chercher dans les recherches, articles, dossiers et publications.', loading: 'Chargement du contenu...',
    by: 'Par'
  }
};

// section -> label key (shared nav strings from site.js) and detail page
const SECTIONS = {
  'research':              { label: 'nav_research_peer', view: id => 'research-view.html?id=' + id },
  'articles':              { label: 'nav_articles_peer', view: id => 'articles-view.html?id=' + id },
  'files':                 { label: 'nav_files',         view: id => 'files-view.html?id=' + id },
  'articles-foreign':      { label: 'nav_foreign',       view: id => 'articles-foreign-view.html?id=' + id },
  'general-articles':      { label: 'nav_articles',      view: id => 'general-article-view.html?id=' + id },
  'editions':              { label: 'nav_editions',      view: id => 'editions-view.html?id=' + id },
  'activities':            { label: 'nav_activities',    view: id => 'activities-view.html?id=' + id },
  'special-politics':      { label: 'sp_politics',       view: () => 'special-politics.html' },
  'special-ir':            { label: 'sp_ir',             view: () => 'special-ir.html' },
  'special-admin-law':     { label: 'sp_admin_law',      view: () => 'special-admin-law.html' },
  'special-const-law':     { label: 'sp_const_law',      view: () => 'special-const-law.html' },
  'special-public-policy': { label: 'sp_public_policy',  view: () => 'special-public-policy.html' }
};

const SHARED_LABELS = {
  ar: { nav_research_peer: 'أبحاث محكمة', nav_articles_peer: 'مقالات محكمة', nav_files: 'ملفات بحثية', nav_foreign: 'مقالات أجنبية', nav_articles: 'مقالات', nav_editions: 'إصداراتنا', nav_activities: 'أنشطتنا', sp_politics: 'علوم سياسية', sp_ir: 'العلاقات الدولية', sp_admin_law: 'القانون الإداري', sp_const_law: 'القانون الدستوري', sp_public_policy: 'السياسات العمومية' },
  en: { nav_research_peer: 'Peer-reviewed research', nav_articles_peer: 'Scholarly Articles', nav_files: 'Research Files', nav_foreign: 'Foreign Articles', nav_articles: 'Articles', nav_editions: 'Publications', nav_activities: 'Activities', sp_politics: 'Political Science', sp_ir: 'International Relations', sp_admin_law: 'Administrative Law', sp_const_law: 'Constitutional Law', sp_public_policy: 'Public Policy' },
  fr: { nav_research_peer: 'Recherches évaluées', nav_articles_peer: 'Articles scientifiques', nav_files: 'Dossiers de recherche', nav_foreign: 'Articles étrangers', nav_articles: 'Articles', nav_editions: 'Publications', nav_activities: 'Activités', sp_politics: 'Science politique', sp_ir: 'Relations internationales', sp_admin_law: 'Droit administratif', sp_const_law: 'Droit constitutionnel', sp_public_policy: 'Politiques publiques' }
};

let currentLang = localStorage.getItem('uiLang') || localStorage.getItem('lang') || 'ar';
let activeSection = 'all';

function t(key) {
  return (translations[currentLang] || translations.ar)[key] || translations.ar[key] || '';
}

function sectionLabel(section) {
  const key = SECTIONS[section]?.label;
  return (SHARED_LABELS[currentLang] || SHARED_LABELS.ar)[key] || section;
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

// all language variants of a field, for matching
function allText(field) {
  if (field == null) return '';
  if (typeof field !== 'object') return String(field);
  return Object.values(field).filter(v => typeof v === 'string').join(' ');
}

function byLang(field) {
  if (field == null) return '';
  if (typeof field !== 'object') return String(field);
  return field[currentLang] || field.ar || field.fr || field.en || '';
}

// lower-case and strip Arabic diacritics/tatweel and alef/yaa/taa-marbuta variants
function normalize(str) {
  return String(str).toLowerCase()
    .replace(/[ً-ْـ]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
}

function highlight(text, terms) {
  let html = esc(text);
  terms.forEach(term => {
    if (term.length < 2) return;
    const safe = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(safe, 'gi'), m => `<mark>${m}</mark>`);
  });
  return html;
}

function getContent() {
  try {
    const list = JSON.parse(localStorage.getItem('contentcache') || '[]');
    return Array.isArray(list) ? list.filter(i => i && SECTIONS[i.section]) : [];
  } catch (e) {
    return [];
  }
}

function getQuery() {
  return (new URLSearchParams(location.search).get('q') || '').trim();
}

function renderFilters(counts) {
  const wrap = document.getElementById('filters');
  const keys = Object.keys(counts);
  if (!keys.length) { wrap.innerHTML = ''; return; }
  const total = keys.reduce((n, k) => n + counts[k], 0);
  const btn = (key, label, n) =>
    `<button type="button" data-section="${key}" aria-pressed="${activeSection === key}">${esc(label)} (${n})</button>`;
  wrap.innerHTML = btn('all', t('all'), total) + keys.map(k => btn(k, sectionLabel(k), counts[k])).join('');
  wrap.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    activeSection = b.dataset.section;
    render();
  }));
}

function render() {
  const query = getQuery();
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');
  document.getElementById('q').value = query;

  if (!query) {
    summary.textContent = '';
    results.innerHTML = `<div class="empty">${esc(t('prompt'))}</div>`;
    renderFilters({});
    return;
  }

  const items = getContent();
  if (!items.length) {
    summary.textContent = t('loading');
    results.innerHTML = '';
    return;
  }

  const terms = normalize(query).split(/\s+/).filter(Boolean);
  const matches = items
    .map(item => {
      const title = normalize(allText(item.title));
      const haystack = title + ' ' + normalize([item.author, item.description, item.short, item.shortContent, item.details, item.keywords].map(allText).join(' '));
      if (!terms.every(term => haystack.includes(term))) return null;
      // title hits rank first
      const score = terms.reduce((n, term) => n + (title.includes(term) ? 3 : 1), 0);
      return { item, score };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score);

  const counts = {};
  matches.forEach(m => { counts[m.item.section] = (counts[m.item.section] || 0) + 1; });
  if (activeSection !== 'all' && !counts[activeSection]) activeSection = 'all';
  renderFilters(counts);

  const shown = activeSection === 'all' ? matches : matches.filter(m => m.item.section === activeSection);
  summary.textContent = `${shown.length} ${t('results')} «${query}»`;

  if (!shown.length) {
    results.innerHTML = `<div class="empty">${esc(t('none'))}</div>`;
    return;
  }

  const rawTerms = query.split(/\s+/).filter(Boolean);
  results.innerHTML = shown.map(({ item }) => {
    const id = encodeURIComponent(item.docId || item.id || '');
    const title = byLang(item.title) || '—';
    const author = byLang(item.author);
    const desc = byLang(item.shortContent) || byLang(item.short) || byLang(item.description) || byLang(item.details);
    const img = item.image || item.photo || item.cover || '';
    return `
      <a class="result" href="${esc(SECTIONS[item.section].view(id))}">
        ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        <div class="result-body">
          <span class="result-type">${esc(sectionLabel(item.section))}</span>
          <h2>${highlight(title, rawTerms)}</h2>
          ${author ? `<div class="meta">${esc(t('by'))} ${highlight(author, rawTerms)}</div>` : ''}
          ${desc ? `<p>${highlight(desc.slice(0, 260), rawTerms)}</p>` : ''}
        </div>
      </a>`;
  }).join('');
}

function submitSearch(e) {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  const url = new URL(location.href);
  if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
  history.pushState(null, '', url);
  activeSection = 'all';
  render();
}

function setLang(lang) {
  currentLang = translations[lang] ? lang : 'ar';
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (translations[currentLang][key] !== undefined) el.textContent = translations[currentLang][key];
  });
  document.querySelectorAll('[data-ph]').forEach(el => {
    const key = el.getAttribute('data-ph');
    if (translations[currentLang][key] !== undefined) el.placeholder = translations[currentLang][key];
  });
  document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === currentLang)));
  render();
}

window.addEventListener('popstate', render);
window.addEventListener('DOMContentLoaded', () => setLang(currentLang));
</script>
<script src="site.js"></script>
</body>
</html>
